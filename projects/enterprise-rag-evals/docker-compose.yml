services:
  rag-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_DB_PATH: /app/var/rag.sqlite3
      RAG_PROVIDER: local
    volumes:
      - rag-data:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  rag-data:
